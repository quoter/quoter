[package]
versioned_files = ["apps/bot/package.json"]
changelog = "CHANGELOG.md"
# executable and its checksum, which the release job downloads
assets = "artifacts/*"

# don't count commit messages (like "feat: ...") as part of the changelog
[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

# don't include date in changelog section titles because it isn't necessarily accurate
[[workflows.steps]]
type = "Command"
shell = true
command = "sed -i -E 's/^(## [0-9]+\\.[0-9]+\\.[0-9]+) \\([0-9-]+\\)$/\\1/' CHANGELOG.md && git add CHANGELOG.md"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "Release Quoter $version"

[workflows.steps.body]
template = "Merging this releases Quoter $version\n\n$changelog"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[github]
owner = "quoter"
repo = "quoter"
