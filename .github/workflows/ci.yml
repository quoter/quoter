name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
	contents: read

concurrency:
	group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
	cancel-in-progress: true

jobs:
	check:
		runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check repository
        run: bun run check

      - name: Build Linux executable
        env:
          BUILD_SHA: ${{ github.sha }}
        run: bun run build:release

      - name: Check Linux executable
        env:
          DISCORD_TOKEN: smoke-test
          DATABASE_PATH: ${{ runner.temp }}/quoter-smoke.sqlite
        run: apps/bot/dist/quoter-linux-x64 --check

      - name: Create checksum
        working-directory: apps/bot/dist
        run: sha256sum quoter-linux-x64 > quoter-linux-x64.sha256

      - name: Upload main snapshot
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: quoter-${{ github.sha }}
          path: |
            apps/bot/dist/quoter-linux-x64
            apps/bot/dist/quoter-linux-x64.sha256
          retention-days: 7
