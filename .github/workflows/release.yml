name: Release

on:
  push:
    branches:
      - main
    paths:
      - apps/bot/package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quoter-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version apps/bot/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        if: steps.version.outputs.publish == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Check repository
        if: steps.version.outputs.publish == 'true'
        run: bun run check

      - name: Build Linux executable
        if: steps.version.outputs.publish == 'true'
        env:
          BUILD_SHA: ${{ github.sha }}
        run: bun run build:release

      - name: Check Linux executable
        if: steps.version.outputs.publish == 'true'
        env:
          DISCORD_TOKEN: smoke-test
          DATABASE_PATH: ${{ runner.temp }}/quoter-smoke.sqlite
        run: apps/bot/dist/quoter-linux-x64 --check

      - name: Prepare release files
        if: steps.version.outputs.publish == 'true'
        run: |
          cd apps/bot/dist
          sha256sum quoter-linux-x64 > quoter-linux-x64.sha256
          cd ../../..
          bun run --cwd apps/bot scripts/release-notes.ts "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --draft --title "Quoter v$VERSION" --notes-file release-notes.md
          gh release upload "v$VERSION" apps/bot/dist/quoter-linux-x64 apps/bot/dist/quoter-linux-x64.sha256
          gh release edit "v$VERSION" --draft=false
